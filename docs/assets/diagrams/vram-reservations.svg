<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 352" role="img" aria-labelledby="vres-t">
  <title id="vres-t">One 32 GB R9700 with two generation reservations, and the room that is left for LLMs</title>
  <!-- 32 GiB over 320 px: 10 px per GiB. Bottom to top. -->
  <g font-family="sans-serif" font-size="13" fill="currentColor">
    <text x="40" y="14" font-weight="bold">32 GB R9700</text>
    <rect x="40" y="20" width="120" height="145" fill="var(--tc-llm)"/>
    <rect x="40" y="165" width="120" height="65" fill="var(--tc-gen)"/>
    <rect x="40" y="230" width="120" height="80" fill="var(--tc-gen)" opacity="0.75"/>
    <rect x="40" y="310" width="120" height="10" fill="var(--tc-margin)"/>
    <rect x="40" y="320" width="120" height="20" fill="var(--tc-other)"/>
    <path d="M40 230 h120" stroke="currentColor"/>
    <rect x="40" y="20" width="120" height="320" fill="none" stroke="currentColor"/>
    <text x="175" y="88" font-weight="bold">Room for LLMs, about 14.5 GiB</text>
    <text x="175" y="104">(less if the desktop uses more)</text>
    <text x="175" y="202">Qwen-Image 2.1 Turbo, 6.5 GiB</text>
    <text x="175" y="274">ACE-Step 1.5 XL SFT, 8.0 GiB</text>
    <text x="175" y="311">Margin, 1 GiB</text>
    <text x="175" y="340">Desktop, other programs, driver: about 2 GiB</text>
  </g>
</svg>
