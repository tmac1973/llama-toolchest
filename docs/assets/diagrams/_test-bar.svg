<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="t">
  <title id="t">Test: one 24 GiB GPU, with one part for each diagram color</title>
  <g font-family="sans-serif" font-size="13" fill="currentColor">
    <rect x="40" y="10" width="120" height="50" fill="var(--tc-free)"/>
    <rect x="40" y="60" width="120" height="20" fill="var(--tc-margin)"/>
    <rect x="40" y="80" width="120" height="12" fill="var(--tc-working)"/>
    <rect x="40" y="92" width="120" height="70" fill="var(--tc-gen)"/>
    <rect x="40" y="162" width="120" height="14" fill="var(--tc-llm-buf)"/>
    <rect x="40" y="176" width="120" height="30" fill="var(--tc-llm-kv)"/>
    <rect x="40" y="206" width="120" height="70" fill="var(--tc-llm)"/>
    <rect x="40" y="276" width="120" height="14" fill="var(--tc-other)"/>
    <rect x="40" y="10" width="120" height="280" fill="none" stroke="currentColor"/>
    <text x="175" y="39">Free</text>
    <text x="175" y="74">Margin</text>
    <text x="175" y="90">Working memory, 1 GiB</text>
    <text x="175" y="131">Generation reservation</text>
    <text x="175" y="173">Buffers</text>
    <text x="175" y="195">KV cache</text>
    <text x="175" y="245">Model weights</text>
    <text x="175" y="287">Desktop and other programs</text>
  </g>
</svg>
