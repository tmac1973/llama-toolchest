<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340" role="img" aria-labelledby="vm-t">
  <title id="vm-t">One 16 GiB GPU: what toolchest counts when it plans a load</title>
  <!-- 16 GiB over 320 px: 20 px per GiB. Bottom to top. -->
  <g font-family="sans-serif" font-size="13" fill="currentColor">
    <text x="40" y="14" font-weight="bold">16 GiB GPU</text>
    <rect x="40" y="20" width="120" height="30" fill="var(--tc-free)"/>
    <rect x="40" y="50" width="120" height="20" fill="var(--tc-margin)"/>
    <rect x="40" y="70" width="120" height="20" fill="var(--tc-llm-buf)"/>
    <rect x="40" y="90" width="120" height="60" fill="var(--tc-llm-kv)"/>
    <rect x="40" y="150" width="120" height="160" fill="var(--tc-llm)"/>
    <rect x="40" y="310" width="120" height="30" fill="var(--tc-other)"/>
    <rect x="40" y="20" width="120" height="320" fill="none" stroke="currentColor"/>
    <text x="175" y="39">Free, 1.5 GiB</text>
    <text x="175" y="64" font-weight="bold">Margin, 1 GiB (the smallest)</text>
    <text x="175" y="84">Buffers, 1 GiB</text>
    <text x="175" y="124">KV cache, 3 GiB</text>
    <text x="175" y="234">Model weights, 8 GiB</text>
    <text x="175" y="329">Desktop and other programs, 1.5 GiB</text>
    <path d="M168 154 v152" stroke="currentColor" fill="none"/>
    <text x="10" y="234" transform="rotate(-90 22 234)" text-anchor="middle">The LLM</text>
  </g>
</svg>
