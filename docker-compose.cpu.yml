services:
  llama-toolchest:
    build:
      context: .
      dockerfile: Dockerfile.cpu
      args:
        # See docker-compose.rocm.yml for the rationale — setup.sh's
        # quick path uses this to invalidate just the package-install
        # layer when a newer release is available.
        LLAMA_TOOLCHEST_VERSION: "${LLAMA_TOOLCHEST_VERSION:-latest}"
        # Development: set by setup.sh --from-source in container mode. A
        # binary built from the local tree, which replaces the packaged one
        # after the package is installed for its dependencies. Empty for a
        # normal build.
        LOCAL_BINARY: "${LOCAL_BINARY:-}"
        # Development: install a locally built .deb/.rpm instead of the
        # released one. Empty for a normal build.
        INSTALL_PACKAGE: "${INSTALL_PACKAGE:-}"
    # Pin the built image name so it matches the Quadlet unit (generate_quadlet
    # in setup.sh). Without this, compose tags the build as
    # <project>_<service> (localhost/llama-toolchest_llama-toolchest) and the
    # systemd service tries to pull localhost/llama-toolchest:latest from a
    # registry, failing with exit 125.
    image: localhost/llama-toolchest:latest
    container_name: llama-toolchest
    ports:
      - "${LLAMA_TOOLCHEST_BIND:-}${LLAMA_TOOLCHEST_PORT:-3000}:3000"   # llama-toolchest management UI
      - "${LLAMA_TOOLCHEST_BIND:-}${LLAMA_TOOLCHEST_INFERENCE_PORT:-8080}:8080"   # llama-server router (chat UI + inference)
    volumes:
      - llama-toolchest-data:/data:z
    env_file:
      - path: .env
        required: false
    environment:
      # LLAMA_TOOLCHEST_MODELS_DIR is a host-side bind-mount source for
      # docker-compose.models.yml, NOT a container path. Blank it here so
      # the runtime never reads a host path out of the container env and
      # mistakes it for an in-container directory (which used to send
      # downloads into the container's writable layer — lost on rebuild).
      LLAMA_TOOLCHEST_MODELS_DIR: ""
    restart: unless-stopped

volumes:
  llama-toolchest-data:
    name: llama-toolchest-data
    driver: local
