{{define "layout"}}
<!DOCTYPE html>
<html lang="en" data-theme="dark" data-custom-theme="graphite" id="html-root">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Llama Toolchest{{if .Title}} — {{.Title}}{{end}}</title>
    <link rel="stylesheet" href="/static/pico.min.css">
    <script src="/static/htmx.min.js"></script>
    <script src="/static/htmx-sse.js"></script>
    <script src="/static/log-panel.js" defer></script>
    <style>
        /* ── Self-hosted IBM Plex (offline; no external font CDN) ── */
        @font-face {
            font-family: 'IBM Plex Sans'; font-style: normal;
            font-weight: 400 700; font-display: swap;
            src: url('/static/fonts/ibm-plex-sans.woff2') format('woff2');
        }
        @font-face {
            font-family: 'IBM Plex Mono'; font-style: normal;
            font-weight: 400; font-display: swap;
            src: url('/static/fonts/ibm-plex-mono-400.woff2') format('woff2');
        }
        @font-face {
            font-family: 'IBM Plex Mono'; font-style: normal;
            font-weight: 500; font-display: swap;
            src: url('/static/fonts/ibm-plex-mono-500.woff2') format('woff2');
        }
        @font-face {
            font-family: 'IBM Plex Mono'; font-style: normal;
            font-weight: 600; font-display: swap;
            src: url('/static/fonts/ibm-plex-mono-600.woff2') format('woff2');
        }

        body { display: flex; min-height: 100vh; margin: 0; }

        /* ── Sidebar (structure shared across themes; colours from Pico vars) ── */
        nav.sidebar {
            width: 224px;
            min-width: 224px;
            padding: 16px;
            border-right: 1px solid var(--pico-muted-border-color);
            background: var(--sidebar-bg, var(--pico-card-sectioning-background-color));
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: stretch;
            gap: 1rem;
        }
        nav.sidebar .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 22px;
        }
        nav.sidebar .brand-badge {
            width: 28px;
            height: 28px;
            min-width: 28px;
            border-radius: 9px;
            background: var(--accent-soft, var(--pico-primary-background));
            border: 1px solid var(--pico-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--pico-primary);
            font-weight: 600;
            font-size: 14px;
        }
        nav.sidebar .brand hgroup { margin: 0; }
        nav.sidebar .brand hgroup h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--pico-h3-color);
        }
        /* Two pseudo-classes give Pico's hgroup-subtitle rule (0,2,0); the
           extra .brand class here makes this (0,2,3) so 11px actually wins. */
        nav.sidebar .brand hgroup p {
            margin: 2px 0 0;
            font-size: 11px;
            line-height: 1.35;
            color: var(--pico-muted-color);
        }
        nav.sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        nav.sidebar li { padding: 0; }
        nav.sidebar a {
            display: block;
            padding: 8px 11px;
            border-radius: 9px;
            text-decoration: none;
            font-size: 15px;
            color: var(--pico-color);
        }
        nav.sidebar a:hover { background: var(--pico-card-background-color); }
        nav.sidebar a[aria-current="page"] {
            font-weight: 600;
            background: var(--accent-soft, var(--pico-primary-background));
            color: var(--pico-primary-hover);
        }
        #monitor-bar { flex-shrink: 0; }
        main { flex: 1; padding: 22px 26px; max-width: 1200px; overflow-y: auto; max-height: 100vh; }

        /* ── Graphite theme (new default dark appearance) ── */
        [data-custom-theme="graphite"] {
            --sidebar-bg: #141619;
            --accent-soft: #262a3a;
            --graphite-warn: #cba76a;

            --pico-background-color: #181a1e;
            --pico-color: #c3c7cf;
            --pico-h1-color: #e9ebef;
            --pico-h2-color: #e9ebef;
            --pico-h3-color: #e9ebef;
            --pico-h4-color: #e9ebef;
            --pico-h5-color: #e9ebef;
            --pico-h6-color: #e9ebef;
            --pico-muted-color: #828892;
            --pico-muted-border-color: #2b2f36;

            --pico-primary: #9aa6d4;
            --pico-primary-hover: #c0c9ea;
            --pico-primary-focus: rgba(154, 166, 212, 0.25);
            --pico-primary-background: #9aa6d4;
            --pico-primary-hover-background: #aab6e0;
            --pico-primary-border: #9aa6d4;
            --pico-primary-inverse: #14161c;
            --pico-primary-underline: rgba(154, 166, 212, 0.5);

            --pico-secondary: #828892;
            --pico-secondary-hover: #aeb6c6;
            --pico-secondary-focus: rgba(130, 136, 146, 0.25);
            --pico-secondary-background: #23272d;
            --pico-secondary-hover-background: #2b3038;
            --pico-secondary-border: #2b2f36;
            --pico-secondary-inverse: #e9ebef;

            --pico-contrast: #e9ebef;
            --pico-contrast-hover: #ffffff;
            --pico-contrast-background: #e9ebef;
            --pico-contrast-inverse: #14161c;

            --pico-card-background-color: #1e2126;
            --pico-card-border-color: #2b2f36;
            --pico-card-sectioning-background-color: #141619;

            --pico-form-element-background-color: #23272d;
            --pico-form-element-selected-background-color: #2b3038;
            --pico-form-element-border-color: #2b2f36;
            --pico-form-element-color: #c3c7cf;
            --pico-form-element-placeholder-color: #6b7079;
            --pico-form-element-focus-color: #9aa6d4;
            --pico-form-element-active-background-color: #23272d;

            --pico-switch-background-color: #2b2f36;
            --pico-switch-checked-background-color: #9aa6d4;
            --pico-switch-color: #ffffff;

            --pico-table-border-color: #2b2f36;
            --pico-table-row-stripped-background-color: #21242a;

            --pico-code-background-color: #23262c;
            --pico-code-color: #aeb6c6;
            --pico-code-kbd-background-color: #262a31;
            --pico-code-kbd-color: #aeb6c6;

            --pico-mark-background-color: #262a3a;
            --pico-mark-color: #9aa6d4;
            --pico-ins-color: #7fb490;
            --pico-del-color: #d98a8a;

            --pico-border-radius: 9px;
            color-scheme: dark;
        }
        /* Cards a touch rounder than controls, per the Graphite spec. */
        [data-custom-theme="graphite"] article { border-radius: 12px; }
        [data-custom-theme="graphite"] input,
        [data-custom-theme="graphite"] select,
        [data-custom-theme="graphite"] textarea { border-radius: 8px; }

        /* Global font stack (self-hosted IBM Plex). Terminal themes below
           re-override to their monospace face, so this only reaches the
           default / Graphite / Light / Cyberpunk appearances. */
        :root {
            --pico-font-family-sans-serif: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
            --pico-font-family-monospace: 'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
            --pico-font-family: var(--pico-font-family-sans-serif);
        }
        /* Base plain-text size. Buttons, inputs and selects size in root-
           relative rem, so they're unaffected by this — only inherited card
           text (names, stats, table cells, file lists) scales up. */
        body { font-size: 16px; }
        h1 { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
        /* <small> is used across the app for readable sub-text (HF stats,
           file names, hints), not just fine print — keep it close to body
           size so e.g. a file name doesn't read tiny beside its button. */
        small { font-size: 0.95em; }
        code, kbd, pre, .mono { font-family: var(--pico-font-family-monospace); }

        /* ── Theme: Terminal Green ── */
        [data-custom-theme="terminal-green"] {
            --pico-background-color: #0a0a0a;
            --pico-color: #33ff33;
            --pico-h1-color: #33ff33;
            --pico-h2-color: #33ff33;
            --pico-h3-color: #33ff33;
            --pico-h4-color: #33ff33;
            --pico-muted-color: #1a9a1a;
            --pico-muted-border-color: #1a5a1a;
            --pico-primary: #33ff33;
            --pico-primary-hover: #66ff66;
            --pico-primary-background: #1a5a1a;
            --pico-primary-hover-background: #2a7a2a;
            --pico-primary-focus: rgba(51, 255, 51, 0.25);
            --pico-primary-inverse: #0a0a0a;
            --pico-card-background-color: #0f1a0f;
            --pico-card-border-color: #1a5a1a;
            --pico-card-sectioning-background-color: #0a140a;
            --pico-form-element-background-color: #0a140a;
            --pico-form-element-border-color: #1a5a1a;
            --pico-form-element-color: #33ff33;
            --pico-form-element-focus-color: #66ff66;
            --pico-switch-color: #1a5a1a;
            --pico-switch-checked-background-color: #33ff33;
            --pico-table-border-color: #1a5a1a;
            --pico-table-row-stripped-background-color: #0f1a0f;
            --pico-code-background-color: #0f1a0f;
            --pico-code-color: #66ff66;
            --pico-kbd-background-color: #1a3a1a;
            --pico-kbd-color: #33ff33;
            --pico-mark-background-color: #1a5a1a;
            --pico-mark-color: #33ff33;
            --pico-ins-color: #66ff66;
            --pico-del-color: #ff3333;
            --pico-secondary: #1a9a1a;
            --pico-secondary-background: #1a5a1a;
            --pico-secondary-hover: #33bb33;
            --pico-secondary-hover-background: #2a7a2a;
            --pico-secondary-focus: rgba(26, 154, 26, 0.25);
            --pico-secondary-inverse: #0a0a0a;
            --pico-contrast: #33ff33;
            --pico-contrast-hover: #66ff66;
            --pico-contrast-background: #33ff33;
            --pico-contrast-hover-background: #66ff66;
            --pico-contrast-focus: rgba(51, 255, 51, 0.25);
            --pico-contrast-inverse: #0a0a0a;
            color-scheme: dark;
        }
        [data-custom-theme="terminal-green"] * {
            font-family: "Courier New", "Lucida Console", monospace !important;
            text-shadow: 0 0 3px rgba(51, 255, 51, 0.3);
        }
        [data-custom-theme="terminal-green"] progress::-webkit-progress-value { background-color: #33ff33; }
        [data-custom-theme="terminal-green"] progress::-moz-progress-bar { background-color: #33ff33; }

        /* ── Theme: Terminal Amber ── */
        [data-custom-theme="terminal-amber"] {
            --pico-background-color: #0a0800;
            --pico-color: #ffb000;
            --pico-h1-color: #ffb000;
            --pico-h2-color: #ffb000;
            --pico-h3-color: #ffb000;
            --pico-h4-color: #ffb000;
            --pico-muted-color: #996a00;
            --pico-muted-border-color: #5a3f00;
            --pico-primary: #ffb000;
            --pico-primary-hover: #ffc633;
            --pico-primary-background: #5a3f00;
            --pico-primary-hover-background: #7a5500;
            --pico-primary-focus: rgba(255, 176, 0, 0.25);
            --pico-primary-inverse: #0a0800;
            --pico-card-background-color: #1a1400;
            --pico-card-border-color: #5a3f00;
            --pico-card-sectioning-background-color: #140f00;
            --pico-form-element-background-color: #140f00;
            --pico-form-element-border-color: #5a3f00;
            --pico-form-element-color: #ffb000;
            --pico-form-element-focus-color: #ffc633;
            --pico-switch-color: #5a3f00;
            --pico-switch-checked-background-color: #ffb000;
            --pico-table-border-color: #5a3f00;
            --pico-table-row-stripped-background-color: #1a1400;
            --pico-code-background-color: #1a1400;
            --pico-code-color: #ffc633;
            --pico-kbd-background-color: #3a2a00;
            --pico-kbd-color: #ffb000;
            --pico-mark-background-color: #5a3f00;
            --pico-mark-color: #ffb000;
            --pico-ins-color: #ffc633;
            --pico-del-color: #ff3333;
            --pico-secondary: #996a00;
            --pico-secondary-background: #5a3f00;
            --pico-secondary-hover: #bb8800;
            --pico-secondary-hover-background: #7a5500;
            --pico-secondary-focus: rgba(153, 106, 0, 0.25);
            --pico-secondary-inverse: #0a0800;
            --pico-contrast: #ffb000;
            --pico-contrast-hover: #ffc633;
            --pico-contrast-background: #ffb000;
            --pico-contrast-hover-background: #ffc633;
            --pico-contrast-focus: rgba(255, 176, 0, 0.25);
            --pico-contrast-inverse: #0a0800;
            color-scheme: dark;
        }
        [data-custom-theme="terminal-amber"] * {
            font-family: "Courier New", "Lucida Console", monospace !important;
            text-shadow: 0 0 3px rgba(255, 176, 0, 0.3);
        }
        [data-custom-theme="terminal-amber"] progress::-webkit-progress-value { background-color: #ffb000; }
        [data-custom-theme="terminal-amber"] progress::-moz-progress-bar { background-color: #ffb000; }

        /* ── Theme: Cyberpunk ── */
        [data-custom-theme="cyberpunk"] {
            --pico-background-color: #0a0014;
            --pico-color: #e0d0ff;
            --pico-h1-color: #ff00ff;
            --pico-h2-color: #ff00ff;
            --pico-h3-color: #ff00ff;
            --pico-h4-color: #ff00ff;
            --pico-muted-color: #8866aa;
            --pico-muted-border-color: #4a2a6a;
            --pico-primary: #ff00ff;
            --pico-primary-hover: #ff66ff;
            --pico-primary-background: #5a005a;
            --pico-primary-hover-background: #7a007a;
            --pico-primary-focus: rgba(255, 0, 255, 0.25);
            --pico-primary-inverse: #0a0014;
            --pico-card-background-color: #140020;
            --pico-card-border-color: #4a2a6a;
            --pico-card-sectioning-background-color: #0f001a;
            --pico-form-element-background-color: #0f001a;
            --pico-form-element-border-color: #4a2a6a;
            --pico-form-element-color: #e0d0ff;
            --pico-form-element-focus-color: #ff66ff;
            --pico-switch-color: #4a2a6a;
            --pico-switch-checked-background-color: #ff00ff;
            --pico-table-border-color: #4a2a6a;
            --pico-table-row-stripped-background-color: #140020;
            --pico-code-background-color: #140020;
            --pico-code-color: #00ffff;
            --pico-kbd-background-color: #2a0040;
            --pico-kbd-color: #00ffff;
            --pico-mark-background-color: #5a005a;
            --pico-mark-color: #ff00ff;
            --pico-ins-color: #00ffff;
            --pico-del-color: #ff3366;
            --pico-secondary: #00bbcc;
            --pico-secondary-background: #004a50;
            --pico-secondary-hover: #00ddee;
            --pico-secondary-hover-background: #006a70;
            --pico-secondary-focus: rgba(0, 187, 204, 0.25);
            --pico-secondary-inverse: #0a0014;
            --pico-contrast: #00ffff;
            --pico-contrast-hover: #66ffff;
            --pico-contrast-background: #00ffff;
            --pico-contrast-hover-background: #66ffff;
            --pico-contrast-focus: rgba(0, 255, 255, 0.25);
            --pico-contrast-inverse: #0a0014;
            color-scheme: dark;
        }
        [data-custom-theme="cyberpunk"] progress::-webkit-progress-value { background-color: #ff00ff; }
        [data-custom-theme="cyberpunk"] progress::-moz-progress-bar { background-color: #ff00ff; }

        /* Available Models card (on Server page) — cap the list height so a
           large enabled set scrolls inside the card instead of stretching
           the whole dashboard row. */
        .available-models-scroll {
            max-height: 14rem;
            overflow-y: auto;
        }
        .available-model-row {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            margin-bottom: 0.2rem;
            font-size: 0.75rem;
            line-height: 1.4;
        }
        .available-model-row > code {
            font-size: 0.75rem;
            padding: 0.05rem 0.3rem;
            background: transparent;
            color: var(--pico-color);
            word-break: break-all;
        }
        button.action-icon,
        button.action-icon:hover,
        button.action-icon:focus {
            background: none;
            border: none;
            padding: 0 0.2rem;
            margin: 0;
            width: auto;
            height: auto;
            font-size: 0.85rem;
            line-height: 1;
            color: var(--pico-muted-color);
            cursor: pointer;
            box-shadow: none;
        }
        button.action-icon:hover {
            color: var(--pico-primary);
        }
        .action-icon-placeholder {
            display: inline-block;
            width: 1.1rem;
        }

        /* Model-list filter controls */
        .model-list-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .model-list-controls input.model-filter {
            flex: 1;
            margin: 0;
        }

        /* Model cards — flat list with one card per model. The configure
           panel sits inside the card border so it's visually tied to the
           model above it, not the model below. */
        .model-card-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .model-card {
            border: 1px solid var(--pico-muted-border-color);
            border-radius: var(--pico-border-radius);
            background: var(--pico-card-background-color);
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .model-card-orphan {
            opacity: 0.6;
        }
        .model-card-incomplete {
            border-left: 3px solid var(--pico-del-color);
        }
        /* Shared grid template — header row and each card's metadata row
           use the same fixed column widths so columns align across rows.
           (Each card is its own grid container, so fixed widths are needed
           for cross-card alignment.) */
        .model-card-header,
        .model-card-row {
            display: grid;
            grid-template-columns: 2.5rem minmax(0, 1fr) 5rem 5rem 5rem 13rem;
            gap: 0.75rem;
            align-items: center;
        }
        .model-card-row {
            padding: 0.5rem 0.75rem;
            font-size: 1rem;
        }
        .model-card-header {
            padding: 0 0.75rem 0.25rem 0.75rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--pico-muted-color);
        }
        .model-card-name {
            min-width: 0;
            overflow-wrap: anywhere;
        }
        .model-card-name mark {
            font-size: 0.7rem;
        }
        .model-card-quant,
        .model-card-vram,
        .model-card-size {
            white-space: nowrap;
            color: var(--pico-color);
        }
        .model-card-actions {
            justify-self: end;
        }
        .model-card-actions button {
            margin: 0;
            font-size: 0.8rem;
            padding: 0.25rem 0.6rem;
            width: auto;
            white-space: nowrap;
        }
        .model-card-actions [role="group"] {
            margin: 0;
        }
        /* Configure panel inside the card. When populated, the owning card's
           border turns accent so a stack of open configs never blurs together,
           and the form is recessed onto an inset surface and nested in its own
           card — visually "belonging to" the model row above it. */
        .model-card:has(.model-card-config:not(:empty)) {
            border-color: var(--pico-primary);
        }
        .model-card-config:not(:empty) {
            border-top: 1px solid var(--pico-muted-border-color);
            padding: 6px;
            background: var(--pico-card-sectioning-background-color);
        }
        .model-card-config > form {
            font-size: 0.85rem;
            margin: 0;
            background: var(--pico-card-background-color);
            border: 1px solid var(--pico-muted-border-color);
            border-radius: 9px;
            padding: 14px 16px;
        }
        /* Owner header naming which model this config belongs to. */
        .model-config-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--pico-muted-border-color);
            font-size: 13px;
            font-weight: 600;
            color: var(--pico-h4-color);
        }
        .model-config-header .mc-owner { color: var(--pico-muted-color); font-weight: 400; }
        .model-config-header .mc-restart {
            font-size: 11px;
            font-weight: 500;
            color: var(--graphite-warn, var(--pico-primary));
            white-space: nowrap;
        }
        .model-card-config input,
        .model-card-config select,
        .model-card-config textarea {
            font-size: 0.85rem;
            padding: 0.3rem 0.5rem;
            height: auto;
            --pico-form-element-spacing-vertical: 0.3rem;
            --pico-form-element-spacing-horizontal: 0.5rem;
        }
        .model-card-config input[type="checkbox"][role="switch"] {
            height: 1.1rem;
        }
        .model-card-config button {
            font-size: 0.8rem;
            padding: 0.25rem 0.6rem;
        }
        .model-card-config label {
            font-size: 0.85rem;
        }
        .model-card-config small {
            font-size: 0.8rem;
        }

        /* ── Shared component touch-ups ── */
        /* Uppercase muted section header ("card-h" in the design). */
        .card-h {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--pico-muted-color);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        /* Off-state switch knob reads muted, per the Graphite spec. */
        [data-custom-theme="graphite"] [role="switch"]:not(:checked) {
            --pico-switch-color: var(--pico-muted-color);
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-top">
            <div class="brand">
                <span class="brand-badge">L</span>
                <hgroup>
                    <h3>Llama Toolchest</h3>
                    <p>Inference Manager <small style="opacity:0.6;">{{ version }}</small></p>
                </hgroup>
            </div>
            <ul>

        {{template "content" .}}
    </main>
<script>
(function() {
    var saved = localStorage.getItem('llama-toolchest-theme');
    if (saved) setTheme(saved);
})();
function setTheme(theme) {
    var el = document.getElementById('html-root');
    if (theme === 'dark' || theme === 'light') {
        el.setAttribute('data-theme', theme);
        el.removeAttribute('data-custom-theme');
    } else {
        el.setAttribute('data-theme', 'dark');
        el.setAttribute('data-custom-theme', theme);
    }
    localStorage.setItem('llama-toolchest-theme', theme);
}
</script>
