{{define "content"}}
<style>
.job-list .job-row { border:1px solid var(--pico-muted-border-color); border-radius:0.25rem; padding:0.5rem 0.75rem; margin-bottom:0.5rem; background:var(--pico-card-background-color); }
.job-list .job-row > summary { list-style:none; cursor:pointer; }
.job-list .job-row > summary::marker, .job-list .job-row > summary::-webkit-details-marker { display:none; }
.job-list .job-row > summary::before { content:"▸"; display:inline-block; width:1rem; color:var(--pico-muted-color); }
.job-list .job-row[open] > summary::before { content:"▾"; }
.job-row-line1 { display:inline-flex; gap:0.6rem; align-items:baseline; }
.job-row-line2 { display:block; margin-left:1rem; margin-top:0.1rem; color:var(--pico-muted-color); }
.job-status, .cell-status { display:inline-block; padding:0.1rem 0.5rem; border-radius:20px; font-size:0.72rem; font-weight:600; line-height:1.4; background:var(--pico-muted-border-color); color:var(--pico-color); text-transform:uppercase; letter-spacing:0.03em; }
/* Graphite status tints — translucent fill + on-tone text. */
.status-running   { background:rgba(154,166,212,.16); color:var(--pico-primary); }
.status-completed { background:rgba(127,180,144,.16); color:var(--pico-ins-color); }
.status-failed    { background:rgba(217,138,138,.16); color:var(--pico-del-color); }
.status-canceled, .status-skipped { background:var(--pico-muted-border-color); color:var(--pico-muted-color); }
.status-pending   { background:transparent; border:1px solid var(--pico-muted-border-color); color:var(--pico-muted-color); }
.cell-failed-tag  { color:var(--pico-del-color); font-size:0.75rem; }
.job-progress     { font-size:0.8rem; color:var(--pico-muted-color); }
.job-detail-slot  { padding:0.5rem 0 0; }
.job-meta, .job-desc { font-size:0.75rem; }
</style>

<article id="jobs-section">
    <header>
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <span>Benchmark Jobs</span>
            <span style="display:flex;gap:0.5rem;">
                <button type="button" class="outline secondary"
                        style="margin:0;padding:0.2rem 0.6rem;font-size:0.8rem;width:auto;"
                        onclick="openBenchHelp()">?</button>
                <button type="button" class="outline secondary"
                        style="margin:0;padding:0.2rem 0.6rem;font-size:0.8rem;width:auto;"
                        onclick="openJobForm()">+ New Batch Job</button>
            </span>
        </div>
    </header>
    <div id="comparison-view"></div>
    <div id="job-list"
         hx-get="/api/benchmark-jobs"
         hx-trigger="load, jobChanged from:body"
         hx-swap="innerHTML">
        Loading…
    </div>
</article>

<dialog id="job-form-modal" style="max-width:720px;">
    <article>
        <header>
            <button type="button" aria-label="Close" rel="prev" onclick="closeJobForm();"></button>
            <span id="job-form-title">New Batch Job</span>
        </header>
        <div id="job-form-slot">Loading…</div>
    </article>
</dialog>

<div id="benchmark-form"
     hx-get="/api/benchmarks/form"
     hx-trigger="load"
     hx-swap="innerHTML">
</div>

<dialog id="bench-help" style="max-width:720px;">
    <article>
        <header>
            <button type="button" aria-label="Close" rel="prev" onclick="this.closest('dialog').close();"></button>
            About Benchmarks
        </header>
        <div id="bench-about-slot">Loading…</div>
    </article>
</dialog>

<script>
// --- Benchmark list: collapse/expand a single model group ---
function toggleBenchGroup(header) {
    if (!header) return;
    var collapsed = header.classList.toggle('collapsed');
    var caret = header.querySelector('.caret');
    if (caret) caret.textContent = collapsed ? '▸' : '▾';
    var root = header.parentElement;
    if (!root) return;
    var name = header.dataset.model || '';
    root.querySelectorAll('tbody.bench-row-group').forEach(function(tb) {
        if ((tb.dataset.model || '') === name) {
            tb.style.display = collapsed ? 'none' : '';
        }
    });
}

function benchContainer(btn) {
    return btn && btn.closest ? btn.closest('.bench-runs-container') : null;
}

function collapseAllBenchGroups(btn) {
    var root = benchContainer(btn);
    if (!root) return;
    root.querySelectorAll('tbody.bench-group-header').forEach(function(h) {
        if (!h.classList.contains('collapsed')) toggleBenchGroup(h);
    });
}

function expandAllBenchGroups(btn) {
    var root = benchContainer(btn);
    if (!root) return;
    root.querySelectorAll('tbody.bench-group-header').forEach(function(h) {
        if (h.classList.contains('collapsed')) toggleBenchGroup(h);
    });
}

function compareSelectedRuns(btn) {
    var root = benchContainer(btn);
    if (!root) return;
    var checks = root.querySelectorAll('.bench-check:checked');
    if (checks.length < 2) { alert('Select at least 2 benchmarks to compare.'); return; }
    var ids = Array.from(checks).map(function(c){return c.value;}).join(',');
    var view = document.getElementById('comparison-view');
    // Use htmx.ajax (not raw fetch + innerHTML) so the inline <script> in
    // the compare partial actually runs — innerHTML doesn't execute scripts.
    htmx.ajax('GET', '/api/benchmarks/compare?ids='+ids, {target: view, swap: 'innerHTML'})
        .then(function(){ view.scrollIntoView({behavior:'smooth'}); });
}

function exportSelectedRuns(btn, format) {
    var root = benchContainer(btn);
    if (!root) return;
    var checks = root.querySelectorAll('.bench-check:checked');
    if (checks.length === 0) { alert('Select benchmarks to export.'); return; }
    var ids = Array.from(checks).map(function(c){return c.value;}).join(',');
    var fmt = format || 'csv';
    window.location = '/api/benchmarks/export?ids=' + ids + '&format=' + fmt;
}

function deleteSelectedRuns(btn) {
    var root = benchContainer(btn);
    if (!root) return;
    var checks = root.querySelectorAll('.bench-check:checked');
    if (checks.length === 0) { alert('Select benchmarks to delete.'); return; }
    if (!confirm('Delete '+checks.length+' benchmark(s)?')) return;
    var ids = Array.from(checks).map(function(c){return c.value;}).join(',');
    fetch('/api/benchmarks/batch-delete?ids='+ids, {method:'DELETE',headers:{'HX-Request':'true'}})
        .then(function(){
            document.body.dispatchEvent(new CustomEvent('jobChanged'));
        });
}

function filterBenchmarks(input, q) {
    q = (q || '').trim().toLowerCase();
    var root = benchContainer(input);
    if (!root) return;

    var rows = root.querySelectorAll('tbody.bench-row-group');
    var headers = root.querySelectorAll('tbody.bench-group-header');

    var matchingByModel = {};
    rows.forEach(function(tb) {
        var matches = !q || (tb.dataset.search || '').indexOf(q) !== -1;
        tb._matches = matches;
        if (matches) matchingByModel[tb.dataset.model || ''] = true;
    });

    var setExpanded = function(header, expanded) {
        if (expanded) header.classList.remove('collapsed');
        else header.classList.add('collapsed');
        var caret = header.querySelector('.caret');
        if (caret) caret.textContent = expanded ? '▾' : '▸';
    };

    // While filtering, expand matching groups so hits are visible. On
    // clear, leave the user's manual collapse state alone.
    if (q) {
        headers.forEach(function(h) {
            setExpanded(h, !!matchingByModel[h.dataset.model || '']);
        });
    }

    var collapsed = {};
    headers.forEach(function(h) {
        collapsed[h.dataset.model || ''] = h.classList.contains('collapsed');
    });

    headers.forEach(function(h) {
        var name = h.dataset.model || '';
        h.style.display = (!q || matchingByModel[name]) ? '' : 'none';
    });
    rows.forEach(function(tb) {
        var name = tb.dataset.model || '';
        tb.style.display = (tb._matches && !collapsed[name]) ? '' : 'none';
    });
}

// --- Preserve job-row expansion state across list refreshes (the list
//     only refreshes on jobChanged now — no auto-poll — so this only
//     fires when the user does something explicit, but still important
//     so e.g. deleting one job doesn't collapse all the others.
(function() {
    var openSet = new Set();
    document.body.addEventListener('htmx:beforeSwap', function(e) {
        var t = e.detail && e.detail.target;
        if (t && t.id === 'job-list') {
            openSet.clear();
            t.querySelectorAll('details.job-row[open]').forEach(function(d) {
                openSet.add(d.dataset.jobId);
            });
        }
    });
    document.body.addEventListener('htmx:afterSwap', function(e) {
        var t = e.detail && e.detail.target;
        if (t && t.id === 'job-list') {
            t.querySelectorAll('details.job-row').forEach(function(d) {
                if (!openSet.has(d.dataset.jobId)) return;
                d.open = true;
                d.dataset.loaded = '1';
                var slot = d.querySelector('.job-detail-slot');
                if (!slot) return;
                var url = slot.getAttribute('hx-get');
                if (url) htmx.ajax('GET', url, {target: slot, swap: 'innerHTML'});
            });
        }
    });
})();

// --- About Benchmarks modal: lazy-loads its content on first open so
//     the preset table + sample commands stay in sync with whatever the
//     server is currently configured to do.
function openBenchHelp() {
    var dialog = document.getElementById('bench-help');
    var slot = document.getElementById('bench-about-slot');
    if (!slot.dataset.loaded) {
        slot.dataset.loaded = '1';
        fetch('/api/benchmarks/about', {headers:{'HX-Request':'true'}})
            .then(function(r){ return r.text(); })
            .then(function(html){ slot.innerHTML = html; });
    }
    dialog.showModal();
}

// --- Job form modal ---
// editingJobID is empty for a new job; set to a job ID when the modal
// was opened via "Edit & Re-run" so submit chooses PUT over POST.
var editingJobID = '';

function openJobForm() {
    editingJobID = '';
    document.getElementById('job-form-title').textContent = 'New Batch Job';
    var modal = document.getElementById('job-form-modal');
    var slot = document.getElementById('job-form-slot');
    slot.innerHTML = 'Loading…';
    fetch('/api/benchmark-jobs/form', {headers:{'HX-Request':'true'}})
        .then(function(r){return r.text();})
        .then(function(html){
            slot.innerHTML = html;
            htmx.process(slot);
            updateMatrixCount();
        });
    modal.showModal();
}
function openJobEditForm(id) {
    editingJobID = id;
    document.getElementById('job-form-title').textContent = 'Edit Batch Job';
    var modal = document.getElementById('job-form-modal');
    var slot = document.getElementById('job-form-slot');
    slot.innerHTML = 'Loading…';
    // Fetch the job JSON and the form HTML in parallel, then pre-fill.
    Promise.all([
        fetch('/api/benchmark-jobs/'+encodeURIComponent(id), {headers:{'Accept':'application/json'}}).then(function(r){
            if (!r.ok) throw new Error('failed to load job: HTTP '+r.status);
            return r.json();
        }),
        fetch('/api/benchmark-jobs/form', {headers:{'HX-Request':'true'}}).then(function(r){return r.text();}),
    ]).then(function(arr) {
        var job = arr[0], html = arr[1];
        slot.innerHTML = html;
        htmx.process(slot);
        prefillJobForm(job);
        updateMatrixCount();
    }).catch(function(e){
        slot.textContent = e.message;
    });
    modal.showModal();
}
function prefillJobForm(job) {
    var form = document.getElementById('new-job-form');
    if (!form) return;
    form.elements.name.value = job.name || '';
    form.elements.description.value = job.description || '';
    var setChecked = function(name, values) {
        var set = {};
        (values || []).forEach(function(v){ set[v] = true; });
        form.querySelectorAll('input[name='+name+']').forEach(function(c){ c.checked = !!set[c.value]; });
    };
    setChecked('model', job.model_ids);
    setChecked('build', job.build_ids);
    setChecked('preset', job.presets);
    // Rebuild the parameter controls from the job's stored shape. Saved
    // jobs still carry overrides and sweeps separately, so both are
    // folded back into one selection per parameter — a fixed override is
    // just a one-value selection.
    var selections = {};
    var ov = job.overrides || {};
    Object.keys(ov).forEach(function(field){
        var v = ov[field];
        if (v === null || v === undefined) return;
        if (typeof v === 'boolean') v = v ? 'true' : 'false';
        selections[field] = [String(v)];
    });
    (job.sweeps || []).forEach(function(axis){
        selections[axis.field] = (axis.values || []).map(String);
    });

    paramRows(form).forEach(function(row){
        var name = row.getAttribute('data-param');
        var values = selections[name] || [];

        var text = row.querySelector('[data-param-text]');
        if (text) {
            var sep = row.getAttribute('data-sep') || ',';
            text.value = values.join(sep === ',' ? ',' : ' ' + sep + ' ');
            return;
        }

        var wanted = {};
        values.forEach(function(v){ wanted[v] = true; });
        row.querySelectorAll('.param-value').forEach(function(c){
            c.checked = !!wanted[c.value];
            delete wanted[c.value];
        });
        // Anything the job used that isn't a curated choice was entered
        // as a custom value; recreate it so editing doesn't drop it.
        Object.keys(wanted).forEach(function(v){
            var input = row.querySelector('.param-custom-input');
            if (!input) return;
            input.value = v;
            addParamCustom(input);
        });
        var inherit = row.querySelector('.param-inherit');
        if (inherit) inherit.checked = values.length === 0;
        syncParamRow(row);
    });

    // Open the parameters pane when the job actually sets something, so
    // an edit shows what it's editing without an extra click.
    if (Object.keys(selections).length > 0) {
        var pane = form.querySelector('details');
        if (pane) pane.open = true;
    }
    // Tweak submit button label so it reads natural in edit mode.
    var btn = document.getElementById('job-submit-btn');
    if (btn) btn.textContent = 'Save & Re-run';
}
function closeJobForm() {
    document.getElementById('job-form-modal').close();
}
// ---- Parameter controls -------------------------------------------------
// One control per parameter: no selection means "use each model's saved
// value", one value fixes it for the job, several sweep it. There is no
// separate override concept — having both was two names for one question,
// and setting both left one of them silently ignored.

function paramRows(form) {
    return Array.from(form.querySelectorAll('.param-row'));
}

// Values a row currently contributes. Free-text rows split on the
// parameter's own separator, matching how the Go parser splits them.
function paramValues(row) {
    var text = row.querySelector('[data-param-text]');
    if (text) {
        var sep = row.getAttribute('data-sep') || ',';
        return text.value.split(sep).map(function(v){return v.trim();}).filter(Boolean);
    }
    var inherit = row.querySelector('.param-inherit');
    if (inherit && inherit.checked) return [];
    return Array.from(row.querySelectorAll('.param-value:checked')).map(function(c){return c.value;});
}

// "Use model's saved value" is mutually exclusive with picking values:
// selecting both would be asking for the default and an override at once.
function onParamInheritToggle(cb) {
    var row = cb.closest('.param-row');
    if (cb.checked) {
        row.querySelectorAll('.param-value').forEach(function(c){ c.checked = false; });
    }
    syncParamRow(row);
}

function onParamValueToggle(cb) {
    var row = cb.closest('.param-row');
    var inherit = row.querySelector('.param-inherit');
    if (cb.checked && inherit) inherit.checked = false;
    syncParamRow(row);
}

function addParamCustom(el) {
    var row = el.closest('.param-row');
    var input = row.querySelector('.param-custom-input');
    var raw = (input.value || '').trim();
    if (!raw) return;

    // Reuse an existing checkbox when the typed value is already offered,
    // so a custom entry can't create a duplicate the server would reject.
    var existing = Array.from(row.querySelectorAll('.param-value'))
        .find(function(c){ return c.value === raw; });
    if (existing) {
        existing.checked = true;
    } else {
        var label = document.createElement('label');
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'param-value';
        cb.value = raw;
        cb.checked = true;
        cb.setAttribute('data-param-value', row.getAttribute('data-param'));
        cb.onchange = function(){ onParamValueToggle(cb); };
        label.appendChild(cb);
        label.appendChild(document.createTextNode(' ' + raw + ' (custom)'));
        row.querySelector('.param-custom').before(label);
    }
    var inherit = row.querySelector('.param-inherit');
    if (inherit) inherit.checked = false;
    input.value = '';
    syncParamRow(row);
}

// Keeps the collapsed summary honest about what's selected, so the state
// is readable without opening every dropdown.
function syncParamRow(row) {
    var summary = row.querySelector('.param-summary');
    if (summary) {
        var values = paramValues(row);
        if (!values.length) {
            summary.textContent = "Use model's saved value";
            summary.removeAttribute('data-active');
        } else if (values.length === 1) {
            summary.textContent = values[0];
            summary.setAttribute('data-active', 'fixed');
        } else {
            summary.textContent = values.join(', ') + ' — sweep';
            summary.setAttribute('data-active', 'sweep');
        }
    }
    updateMatrixCount();
}

// The request shape: parameter → selected values. The server decides
// which are fixed and which are swept, so the browser never has to.
function readParams(form) {
    var params = {};
    paramRows(form).forEach(function(row){
        var values = paramValues(row);
        if (values.length) params[row.getAttribute('data-param')] = values;
    });
    return Object.keys(params).length ? params : null;
}

function fillUbatchLadder() {
    var form = document.getElementById('new-job-form');
    if (!form) return;
    var row = form.querySelector('.param-row[data-param="ubatch_size"]');
    if (!row) return;
    var wanted = ['64','128','256','512','1024','2048'];
    row.querySelectorAll('.param-value').forEach(function(c){
        c.checked = wanted.indexOf(c.value) !== -1;
    });
    var inherit = row.querySelector('.param-inherit');
    if (inherit) inherit.checked = false;
    var menu = row.querySelector('.param-menu');
    if (menu) menu.open = true;
    syncParamRow(row);
}

function updateMatrixCount() {
    var form = document.getElementById('new-job-form');
    if (!form) return;
    var m = form.querySelectorAll('input[name=model]:checked').length;
    var b = form.querySelectorAll('input[name=build]:checked').length;
    var p = form.querySelectorAll('input[name=preset]:checked').length;
    var preview = document.getElementById('job-matrix-preview');
    var btn = document.getElementById('job-submit-btn');
    if (!(m && b && p)) {
        preview.textContent = 'Select models, builds, and presets to compute the matrix size.';
        btn.disabled = true;
        return;
    }

    var sweepCells = 1, reloadPoints = 1, desc = '';
    paramRows(form).forEach(function(row){
        var n = paramValues(row).length;
        if (n < 2) return;                        // one value fixes it, no extra cells
        sweepCells *= n;
        if (row.getAttribute('data-restarts')) reloadPoints *= n;
        desc += ' × ' + n + ' ' + row.getAttribute('data-param');
    });

    var cells = m*b*p*sweepCells;
    var text = m+' models × '+b+' builds × '+p+' presets'+desc+' = '+cells+' cells';

    // Reloads are what make a sweep slow, so surface them next to the
    // cell count. Matches the runner: one reload per distinct
    // (model, config), amortized across presets.
    if (sweepCells > 1 || form.querySelector('.param-summary[data-active]')) {
        var reloads = m*b*reloadPoints;
        text += ' · ~'+reloads+' llama-server reload'+(reloads===1?'':'s');
    }
    preview.textContent = text;

    var max = parseInt(form.getAttribute('data-max-cells'), 10) || Infinity;
    if (cells > max) {
        preview.textContent = text+' — over the '+max+'-cell limit';
        btn.disabled = true;
        return;
    }
    btn.disabled = false;
}
function submitNewJob() {
    var form = document.getElementById('new-job-form');
    var err = document.getElementById('job-form-error');
    err.style.display = 'none';
    var picked = function(name){ return Array.from(form.querySelectorAll('input[name='+name+']:checked')).map(function(c){return c.value;}); };
    var payload = {
        name: form.elements.name.value.trim(),
        description: form.elements.description.value.trim(),
        model_ids: picked('model'),
        build_ids: picked('build'),
        presets: picked('preset'),
        params: readParams(form),
    };
    var isEdit = !!editingJobID;
    var url = isEdit ? '/api/benchmark-jobs/'+encodeURIComponent(editingJobID) : '/api/benchmark-jobs';
    var method = isEdit ? 'PUT' : 'POST';
    fetch(url, {method:method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)})
        .then(function(r){
            if (r.ok) {
                closeJobForm();
                document.body.dispatchEvent(new CustomEvent('jobChanged'));
                return;
            }
            return r.text().then(function(t){ throw new Error('HTTP '+r.status+': '+t); });
        })
        .catch(function(e){ err.textContent = e.message; err.style.display = ''; });
}

// --- Job actions ---
function cancelJob(id) {
    if (!confirm('Cancel job '+id+'?')) return;
    fetch('/api/benchmark-jobs/'+id+'/cancel', {method:'POST'}).then(function(){
        document.body.dispatchEvent(new CustomEvent('jobChanged'));
    });
}
function retryFailed(id) {
    fetch('/api/benchmark-jobs/'+id+'/retry-failed', {method:'POST'}).then(function(r){
        if (!r.ok) { return r.text().then(function(t){alert(t);}); }
        document.body.dispatchEvent(new CustomEvent('jobChanged'));
    });
}
function deleteJob(id, disposition) {
    var msg = disposition==='cascade' ? 'Delete job '+id+' AND its runs?' : 'Delete job '+id+' but keep runs (move to Ad-Hoc)?';
    if (!confirm(msg)) return;
    fetch('/api/benchmark-jobs/'+id+'?runs='+disposition, {method:'DELETE'}).then(function(r){
        if (!r.ok) { return r.text().then(function(t){alert(t);}); }
        document.body.dispatchEvent(new CustomEvent('jobChanged'));
    });
}
function compareSelectedCells(btn) {
    var checks = btn.closest('.job-detail').querySelectorAll('.cell-check:checked');
    if (checks.length < 2) { alert('Select at least 2 cells to compare.'); return; }
    var ids = Array.from(checks).map(function(c){return c.value;}).join(',');
    var view = document.getElementById('comparison-view');
    htmx.ajax('GET', '/api/benchmarks/compare?ids='+ids, {target: view, swap: 'innerHTML'})
        .then(function(){ view.scrollIntoView({behavior:'smooth'}); });
}

</script>
