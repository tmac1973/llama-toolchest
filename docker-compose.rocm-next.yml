# Experimental ROCm variant — see Dockerfile.rocm-next.
#
# Identical to docker-compose.rocm.yml apart from the Dockerfile it builds and
# the ROCM_BASE_IMAGE build argument: same image name, same devices, same group
# and IPC settings, so the Quadlet unit and everything else treats the two
# interchangeably. ROCm 10 is published only as a container image, which is why
# this variant exists at all.
services:
  llama-toolchest:
    build:
      context: .
      dockerfile: Dockerfile.rocm-next
      args:
        # setup.sh resolves the latest release tag from GH and exports
        # LLAMA_TOOLCHEST_VERSION before invoking compose, so this build
        # arg pins the .deb being installed. Only the package-install
        # layer's cache invalidates when the version changes — the ROCm
        # base image layers stay cached. Falls back to "latest" if unset,
        # in which case the Dockerfile resolves it at build time itself.
        LLAMA_TOOLCHEST_VERSION: "${LLAMA_TOOLCHEST_VERSION:-latest}"
        # Development: set by setup.sh --from-source in container mode. A
        # binary built from the local tree, which replaces the packaged one
        # after the package is installed for its dependencies. Empty for a
        # normal build.
        LOCAL_BINARY: "${LOCAL_BINARY:-}"
        # Development: install a locally built .deb/.rpm instead of the
        # released one. Empty for a normal build.
        INSTALL_PACKAGE: "${INSTALL_PACKAGE:-}"
        # Which ROCm release to build against. setup.sh writes this to
        # .env from the variant chosen at install time; the default here
        # is what a bare `compose build` with no .env uses. Any tag from
        # https://hub.docker.com/r/rocm/dev-ubuntu-24.04/tags works.
        ROCM_BASE_IMAGE: "${ROCM_BASE_IMAGE:-docker.io/rocm/dev-ubuntu-24.04:10.0.0-full}"
    # Pin the built image name so it matches the Quadlet unit (generate_quadlet
    # in setup.sh). Without this, compose tags the build as
    # <project>_<service> (localhost/llama-toolchest_llama-toolchest) and the
    # systemd service tries to pull localhost/llama-toolchest:latest from a
    # registry, failing with exit 125.
    image: localhost/llama-toolchest:latest
    container_name: llama-toolchest
    ports:
      - "${LLAMA_TOOLCHEST_BIND:-}${LLAMA_TOOLCHEST_PORT:-3000}:3000"   # llama-toolchest management UI
      - "${LLAMA_TOOLCHEST_BIND:-}${LLAMA_TOOLCHEST_INFERENCE_PORT:-8080}:8080"   # llama-server router (chat UI + inference)
    volumes:
      - llama-toolchest-data:/data:z
    devices:
      - /dev/kfd:/dev/kfd       # AMD GPU kernel interface
      - /dev/dri:/dev/dri       # DRM render nodes
    group_add:
      - "${HOST_VIDEO_GID:-video}"
      - "${HOST_RENDER_GID:-render}"
    ipc: host                    # GPUs talk to each other through shared memory:
                                 # NCCL on NVIDIA, and ROCm's own transport. Without
                                 # it a tensor-parallel split aborts with
                                 # "CUDA error: unhandled system error" once the
                                 # cards first have to exchange partial results.
    security_opt:
      - seccomp=unconfined      # required for ROCm
    ulimits:
      memlock:
        soft: -1
        hard: -1
    env_file:
      - path: .env
        required: false
    environment:
      # LLAMA_TOOLCHEST_MODELS_DIR is a host-side bind-mount source for
      # docker-compose.models.yml, NOT a container path. Blank it here so
      # the runtime never reads a host path out of the container env and
      # mistakes it for an in-container directory (which used to send
      # downloads into the container's writable layer — lost on rebuild).
      LLAMA_TOOLCHEST_MODELS_DIR: ""
    restart: unless-stopped

volumes:
  llama-toolchest-data:
    name: llama-toolchest-data
    driver: local
